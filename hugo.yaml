# Hugo configuration file
title: My Site

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

defaultContentLanguage: fr

menu:
  main:
    # --- Microsoft ---
    - identifier: windows
      name: "Windows"
      weight: 1
      params:
        type: menu
    - name: "Windows Serveur"
      pageRef: /windows-server
      parent: windows
      weight: 1
    - name: "Administration système"
      pageRef: /administration-systeme
      parent: windows
      weight: 2
    - name: "À propos"
      pageRef: /about
      weight: 2
    - name: Contact ↗
      url: "https://github.com/imfing"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/batcrou31/hugo-hextra/edit/main/content"
