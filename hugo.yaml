# Hugo configuration file
title: batcrou.fr

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

defaultContentLanguage: fr

menu:
  main:
    # --- Microsoft ---
    - identifier: windows
      name: "Windows"
      weight: 1
      params:
        type: menu
    - name: "Windows Serveur 2025"
      pageRef: /windows-serveur/serveur-2025/
      parent: windows
      weight: 1
    - name: "Administration système"
      pageRef: /administration-systeme
      parent: windows
      weight: 2
    # --- Linux ---
    - identifier: linux
      name: "Linux"
      weight: 2
      params:
        type: menu
    - name: "Debian"
      pageRef: /linux/debian
      parent: linux
      weight: 1
    - name: "À propos"
      pageRef: /about
      weight: 3
    - name: Contact ↗
      url: "https://github.com/imfing"
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: Theme Toggle
      weight: 6
      params:
        type: theme-toggle

# Parse Git commit
enableGitInfo: true

params:
  # Display the last modification date
  displayUpdatedDate: true
  dateFormat: "2 January 2006"
  # Display the author of the last modification
  displayUpdatedAuthor: false

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: wide
    links:
      - title: Linkedin
        url: "https://www.linkedin.com/in/baptiste-crouvizier-8485a43b0"
        icon: linkedin
      - title: Discord
        url: "https://discord.com/users/925729438790995998"
        icon: discord

  imageZoom:
    enable: true
    base: "https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist"
    #js: "js/medium-zoom.min.js" # optional, relative to the base or local assets

  editURL:
    enable: true
    base: "https://github.com/batcrou31/hugo-hextra/edit/main/content"

frontmatter:
  date:
    - date
    - publishDate
    - lastmod
  lastmod:
    - lastmod
    - :git
    - date
    - publishDate